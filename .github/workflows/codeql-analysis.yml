name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 15 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    # TypeScript is analysed from source: no build is needed.
    - uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - uses: github/codeql-action/analyze@v3
